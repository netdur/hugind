[package]
name = "hugind"
version = "0.1.0"
edition = "2024"

[dependencies]
rquickjs = { version = "0.6", features = ["loader", "futures", "classes", "macro"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
serde_json = "1.0"
dirs = "6.0.0"
sysinfo = "0.38.0"
inquire = "0.9.2"
indicatif = "0.18.3"
futures-util = "0.3.31"

[dev-dependencies]
tempfile = "3.24.0"

