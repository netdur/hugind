# Hugind Server Configuration Example
# See docs/server_config.md for full reference.

server:
  host: "0.0.0.0"
  port: 8080
  # api_key: ""
  # max_slots: 4
  system_prompt: "You are a helpful assistant."
  # enable_thinking_default: false
  # thinking_budget_tokens: null

model:
  path: "models/model.gguf"
  # mmproj_path: ""
  gpu_layers: 99
  split_mode: layer
  use_mmap: true

context:
  size: 4096
  batch_size: 2048
  threads: 8
  flash_attention: false
  offload_kqv: true

sampling:
  temp: 0.7
  top_k: 40
  top_p: 0.95
  min_p: 0.05
  repeat_penalty: 1.1

fit:
  enabled: false
  min_ctx: 0
