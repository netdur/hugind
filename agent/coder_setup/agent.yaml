name: "coder_setup"
version: "0.1.0"
description: "Deterministically manages per-run git worktrees for swarm runs."
author: "hugind"
license: "MIT"
hugind_version: ">=0.6.0"
entry_point: "main.js"
backend:
  url: "http://127.0.0.1:8080/v1"
  session:
    mode: fresh
permissions:
  network:
    allow: false
  filesystem:
    allow: true
    read: true
    write: true
    create: true
    delete: true
    allow_outside_agent_root: true
  shell:
    allow: true
    whitelist:
      - "git"
      - "rm"
dependencies:
  mcp: []
env: []
