name: "chrome_tester_v2"
version: "0.2.0"
description: "Autonomous browser testing agent using Chrome DevTools MCP."
author: "hugind"
license: "MIT"
hugind_version: ">=0.6.0"
entry_point: "main.js"

backend:
  url: "http://127.0.0.1:8080/v1"
  session:
    mode: fresh

permissions:
  network:
    allow: false
    allowed_domains: []
  filesystem:
    allow: true
    read: true
    write: true
    create: true
    delete: false
  shell:
    allow: false
dependencies:
  mcp:
    - name: "chrome-devtools"
      required: true
      description: "Official Chrome DevTools MCP server."
      transport: "stdio"
      command: "npx"
      args:
        - "-y"
        - "chrome-devtools-mcp@latest"
        - "--isolated"
        - "--no-usage-statistics"
        - "--experimentalStructuredContent"

env: []
