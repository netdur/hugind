name: "mobile_tester"
version: "0.1.0"
description: "Controls Android devices via adb shell."
author: "hugind"
license: "MIT"
hugind_version: ">=0.6.0"
entry_point: "main.js"
backend:
  config: "qwen3-8b"

permissions:
  network:
    allow: true
    allowed_domains: []
  filesystem:
    allow: false
  shell:
    allow: true
    whitelist:
      - "adb"

env: []
