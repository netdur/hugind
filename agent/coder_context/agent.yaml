name: "coder_context"
version: "0.1.0"
description: "Builds task-aware project context and ranked target files for coder."
author: "hugind"
license: "MIT"
hugind_version: ">=0.6.0"
entry_point: "main.js"
backend:
  url: "http://127.0.0.1:8080/v1"
  session:
    mode: stateless
permissions:
  network:
    allow: false
  filesystem:
    allow: true
    read: true
    write: true
    create: true
    allow_outside_agent_root: true
  shell:
    allow: false
dependencies:
  mcp: []
env: []
