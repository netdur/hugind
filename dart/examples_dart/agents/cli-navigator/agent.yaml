name: "cli-navigator"
version: "0.1.0"
description: "Turns plain-English requests into shell commands and executes them interactively."
hugind_version: ">=0.6.0"
entry_point: "main.drt"
backend: "gemma-4b"

permissions:
  network:
    allow: false
  filesystem:
    read: false
    write: false
  shell:
    allow: true
    whitelist:
      - "sh"

dependencies:
  mcp: []

env: []
